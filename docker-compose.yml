version: "3.8"

services:
  train:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./models:/app/models
    command: python train.py

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    volumes:
      - ./models:/app/models
    ports:
      - "8000:8000"
    depends_on:
      - train